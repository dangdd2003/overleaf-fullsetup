name: Docker Image Builder

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Defined registries
  REGISTRY1: ghcr.io
  REGISTRY2: docker.io
  # Image names
  BASE_IMAGE_NAME: sharelatex-base
  FULL_IMAGE_NAME: sharelatex
  SLIM_IMAGE_NAME: sharelatex-slim
  TEXLIVE_FULL_IMAGE_NAME: texlive-full
  GIT_BRIDGE_IMAGE_NAME: git-bridge

jobs:
  detect-changes:
    name: Detect Changed Paths
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.filter.outputs.base }}
      app: ${{ steps.filter.outputs.app }}
      gitbridge: ${{ steps.filter.outputs.gitbridge }}
      texlive: ${{ steps.filter.outputs.texlive }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            base:
              - 'overleaf/server-ce/Dockerfile-base'
            app:
              - 'overleaf/libraries/**'
              - 'overleaf/services/**'
              - '!overleaf/services/git-bridge/**'
              - 'overleaf/tools/migrations/**'
              - 'overleaf/server-ce/Dockerfile'
              - 'overleaf/server-ce/Dockerfile.slim'
              - 'overleaf/server-ce/genScript.js'
              - 'overleaf/server-ce/services.js'
              - 'overleaf/package.json'
              - 'overleaf/yarn.lock'
              - 'overleaf/.yarnrc.yml'
            gitbridge:
              - 'overleaf/services/git-bridge/**'
            texlive:
              - 'overleaf/server-ce/Dockerfile.texlive-full'

  build-base:
    name: Build Sharelatex Base Image
    needs: detect-changes
    if: always() && (github.event_name != 'push' || needs.detect-changes.outputs.base == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      date: ${{ steps.build_env.outputs.date }}
      monorepo_revision: ${{ steps.build_env.outputs.MONOREPO_REVISION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set build env
        id: build_env
        run: |
          echo "date=$(TZ=Asia/Ho_Chi_Minh date +"%Y-%m-%d")" >> "$GITHUB_OUTPUT"
          echo "MONOREPO_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Check build env
        run: |
          echo "Current build date: ${{ steps.build_env.outputs.date }}"
          echo "Current repo commit hash: ${{ steps.build_env.outputs.MONOREPO_REVISION }}"

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Docker login registry ${{ env.REGISTRY1 }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY1 }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker login registry ${{ env.REGISTRY2 }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build base image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./overleaf
          file: ./overleaf/server-ce/Dockerfile-base
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            TEXLIVE_MIRROR=${{ vars.TEXLIVE_MIRROR || 'https://mirror.ctan.org/systems/texlive/tlnet' }}
          cache-from: type=gha,scope=sharelatex-base
          cache-to: type=gha,mode=max,scope=sharelatex-base
          tags: |
            ${{ env.REGISTRY1 }}/${{ github.actor }}/${{ env.BASE_IMAGE_NAME }}:latest
            ${{ env.REGISTRY1 }}/${{ github.actor }}/${{ env.BASE_IMAGE_NAME }}:${{ steps.build_env.outputs.date }}
            ${{ vars.DOCKER_USERNAME }}/${{ env.BASE_IMAGE_NAME }}:latest
            ${{ vars.DOCKER_USERNAME }}/${{ env.BASE_IMAGE_NAME }}:${{ steps.build_env.outputs.date }}
          push: true

  build-full:
    name: Build Sharelatex Full Image
    needs: [detect-changes, build-base]
    if: always() && needs.build-base.result != 'failure' && (github.event_name != 'push' || needs.detect-changes.outputs.base == 'true' || needs.detect-changes.outputs.app == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set build env
        id: build_env
        run: |
          echo "date=$(TZ=Asia/Ho_Chi_Minh date +"%Y-%m-%d")" >> "$GITHUB_OUTPUT"
          echo "MONOREPO_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Docker login registry ${{ env.REGISTRY1 }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY1 }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker login registry ${{ env.REGISTRY2 }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build full image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./overleaf
          file: ./overleaf/server-ce/Dockerfile
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            OVERLEAF_BASE_TAG=${{ vars.DOCKER_USERNAME }}/${{ env.BASE_IMAGE_NAME }}:latest
            MONOREPO_REVISION=${{ steps.build_env.outputs.MONOREPO_REVISION }}
            TEXLIVE_MIRROR=${{ vars.TEXLIVE_MIRROR || 'https://mirror.ctan.org/systems/texlive/tlnet' }}
            NODE_VERSION=${{ vars.NODE_VERSION || 'v24.20.0' }}
          cache-from: type=gha,scope=sharelatex-full
          cache-to: type=gha,mode=max,scope=sharelatex-full
          tags: |
            ${{ env.REGISTRY1 }}/${{ github.actor }}/${{ env.FULL_IMAGE_NAME }}:latest
            ${{ env.REGISTRY1 }}/${{ github.actor }}/${{ env.FULL_IMAGE_NAME }}:${{ steps.build_env.outputs.date }}
            ${{ vars.DOCKER_USERNAME }}/${{ env.FULL_IMAGE_NAME }}:latest
            ${{ vars.DOCKER_USERNAME }}/${{ env.FULL_IMAGE_NAME }}:${{ steps.build_env.outputs.date }}
          push: true

  build-slim:
    name: Build Sharelatex Slim Image
    needs: [detect-changes, build-base]
    if: always() && needs.build-base.result != 'failure' && (github.event_name != 'push' || needs.detect-changes.outputs.base == 'true' || needs.detect-changes.outputs.app == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set build env
        id: build_env
        run: |
          echo "date=$(TZ=Asia/Ho_Chi_Minh date +"%Y-%m-%d")" >> "$GITHUB_OUTPUT"
          echo "MONOREPO_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Docker login registry ${{ env.REGISTRY1 }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY1 }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker login registry ${{ env.REGISTRY2 }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build slim control plane image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./overleaf
          file: ./overleaf/server-ce/Dockerfile.slim
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            OVERLEAF_BASE_TAG=${{ vars.DOCKER_USERNAME }}/${{ env.BASE_IMAGE_NAME }}:latest
            MONOREPO_REVISION=${{ steps.build_env.outputs.MONOREPO_REVISION }}
            NODE_VERSION=${{ vars.NODE_VERSION || 'v24.20.0' }}
          cache-from: type=gha,scope=sharelatex-slim
          cache-to: type=gha,mode=max,scope=sharelatex-slim
          tags: |
            ${{ env.REGISTRY1 }}/${{ github.actor }}/${{ env.SLIM_IMAGE_NAME }}:latest
            ${{ env.REGISTRY1 }}/${{ github.actor }}/${{ env.SLIM_IMAGE_NAME }}:${{ steps.build_env.outputs.date }}
            ${{ vars.DOCKER_USERNAME }}/${{ env.SLIM_IMAGE_NAME }}:latest
            ${{ vars.DOCKER_USERNAME }}/${{ env.SLIM_IMAGE_NAME }}:${{ steps.build_env.outputs.date }}
          push: true

  build-texlive-full:
    name: Build TeX Live Full (${{ matrix.year }})
    needs: detect-changes
    if: always() && (github.event_name != 'push' || needs.detect-changes.outputs.texlive == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: "2026"
            is_latest: true
          - year: "2025"
            is_latest: false
          - year: "2024"
            is_latest: false
          - year: "2023"
            is_latest: false
          - year: "2022"
            is_latest: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set build env
        id: build_env
        run: |
          echo "date=$(TZ=Asia/Ho_Chi_Minh date +"%Y-%m-%d")" >> "$GITHUB_OUTPUT"
          
          # Dynamic mirror URLs with verified HTTPS archives
          DEFAULT_ACTIVE_MIRROR="${{ vars.TEXLIVE_MIRROR || 'https://mirror.ctan.org/systems/texlive/tlnet' }}"
          DEFAULT_HISTORIC_MIRROR="${{ vars.TEXLIVE_HISTORIC_MIRROR || 'https://ftp.math.utah.edu/pub/tex/historic/systems/texlive' }}"
          
          if [ "${{ matrix.is_latest }}" = "true" ]; then
            echo "mirror=${DEFAULT_ACTIVE_MIRROR}" >> "$GITHUB_OUTPUT"
            echo "installer=${DEFAULT_ACTIVE_MIRROR}/install-tl-unx.tar.gz" >> "$GITHUB_OUTPUT"
          else
            echo "mirror=${DEFAULT_HISTORIC_MIRROR}/${{ matrix.year }}/tlnet-final" >> "$GITHUB_OUTPUT"
            echo "installer=${DEFAULT_HISTORIC_MIRROR}/${{ matrix.year }}/install-tl-unx.tar.gz" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Check build env
        run: |
          echo "Current build date: ${{ steps.build_env.outputs.date }}"
          echo "Building TeX Live version: ${{ matrix.year }}"
          echo "Using TeX Live mirror: ${{ steps.build_env.outputs.mirror }}"
          echo "Dated tag will be: ${{ matrix.year }}_${{ steps.build_env.outputs.date }}"

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Docker login registry ${{ env.REGISTRY1 }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY1 }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker login registry ${{ env.REGISTRY2 }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push texlive-full (${{ matrix.year }})
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./overleaf
          file: ./overleaf/server-ce/Dockerfile.texlive-full
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            TEXLIVE_YEAR=${{ matrix.year }}
            TEXLIVE_MIRROR=${{ steps.build_env.outputs.mirror }}
            TEXLIVE_INSTALLER_URL=${{ steps.build_env.outputs.installer }}
          cache-from: type=gha,scope=texlive-full-${{ matrix.year }}
          cache-to: type=gha,mode=max,scope=texlive-full-${{ matrix.year }}
          tags: |
            ${{ env.REGISTRY1 }}/${{ github.actor }}/${{ env.TEXLIVE_FULL_IMAGE_NAME }}:${{ matrix.year }}
            ${{ env.REGISTRY1 }}/${{ github.actor }}/${{ env.TEXLIVE_FULL_IMAGE_NAME }}:${{ matrix.year }}_${{ steps.build_env.outputs.date }}
            ${{ vars.DOCKER_USERNAME }}/${{ env.TEXLIVE_FULL_IMAGE_NAME }}:${{ matrix.year }}
            ${{ vars.DOCKER_USERNAME }}/${{ env.TEXLIVE_FULL_IMAGE_NAME }}:${{ matrix.year }}_${{ steps.build_env.outputs.date }}
            ${{ matrix.is_latest && format('{0}/{1}/{2}:latest', env.REGISTRY1, github.actor, env.TEXLIVE_FULL_IMAGE_NAME) || '' }}
            ${{ matrix.is_latest && format('{0}/{1}:latest', vars.DOCKER_USERNAME, env.TEXLIVE_FULL_IMAGE_NAME) || '' }}
          push: true

  build-git-bridge:
    name: Build Git Bridge Image
    needs: detect-changes
    if: always() && (github.event_name != 'push' || needs.detect-changes.outputs.gitbridge == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set build env
        id: build_env
        run: |
          echo "date=$(TZ=Asia/Ho_Chi_Minh date +"%Y-%m-%d")" >> "$GITHUB_OUTPUT"
          echo "MONOREPO_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Check build env
        run: |
          echo "Current build date: ${{ steps.build_env.outputs.date }}"
          echo "Current repo commit hash: ${{ steps.build_env.outputs.MONOREPO_REVISION }}"

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Docker login registry ${{ env.REGISTRY1 }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY1 }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker login registry ${{ env.REGISTRY2 }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push git-bridge
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./overleaf/services/git-bridge
          file: ./overleaf/services/git-bridge/Dockerfile
          cache-from: type=gha,scope=git-bridge
          cache-to: type=gha,mode=max,scope=git-bridge
          tags: |
            ${{ env.REGISTRY1 }}/${{ github.actor }}/${{ env.GIT_BRIDGE_IMAGE_NAME }}:latest
            ${{ env.REGISTRY1 }}/${{ github.actor }}/${{ env.GIT_BRIDGE_IMAGE_NAME }}:${{ steps.build_env.outputs.date }}
            ${{ vars.DOCKER_USERNAME }}/${{ env.GIT_BRIDGE_IMAGE_NAME }}:latest
            ${{ vars.DOCKER_USERNAME }}/${{ env.GIT_BRIDGE_IMAGE_NAME }}:${{ steps.build_env.outputs.date }}
          push: true
