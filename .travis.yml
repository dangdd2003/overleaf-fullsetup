# Travis CI fallback for .github/workflows/build-and-push.yaml.
# Builds from the vendored ./overleaf monorepo (not upstream overleaf/overleaf).
# Secrets (DOCKER_USERNAME, DOCKER_TOKEN, GHCR_USERNAME, GHCR_TOKEN) live in
# Repository Settings > Environment Variables; see ci/travis-build.sh.
version: ~> 1.0

os: linux
arch: amd64
dist: jammy
# minimal image: skip the default Ruby toolchain setup
language: minimal
# Docker 28.x ships on jammy; no engine reinstall needed
services:
  - docker

git:
  depth: 1
  submodules: false

# Secrets are not exposed to PR builds, and pushes should only come from main
if: branch = main AND type IN (push, cron, api)

env:
  global:
    - TZ=Asia/Ho_Chi_Minh
    - GHCR=ghcr.io
    - TEXLIVE_MIRROR=https://mirror.ctan.org/systems/texlive/tlnet
    - NODE_VERSION=v24.20.0
    - BUILDX_VERSION=v0.19.3

before_install:
  # buildx is not listed on the Travis image pages; install the CLI plugin only if missing
  - |
    if ! docker buildx version >/dev/null 2>&1; then
      mkdir -p ~/.docker/cli-plugins
      curl -fsSL -o ~/.docker/cli-plugins/docker-buildx \
        "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64"
      chmod +x ~/.docker/cli-plugins/docker-buildx
    fi

before_script:
  - docker version
  - docker buildx version
  # default VM has ~50 GB disk; images here are several GB
  - df -h /

stages:
  - name: base
  - name: images

# Public repos: 50 min per job. Build output streams live; ci/travis-build.sh
# prints a keep-alive line so quiet steps don't hit the 10-min no-output kill
# (travis_wait is avoided because it buffers all output until the end).
jobs:
  include:
    - stage: base
      name: sharelatex-base
      script: ./ci/travis-build.sh base
    - stage: images
      name: sharelatex
      script: ./ci/travis-build.sh full
    - name: sharelatex-slim
      script: ./ci/travis-build.sh slim
    - name: git-bridge
      script: ./ci/travis-build.sh git-bridge
